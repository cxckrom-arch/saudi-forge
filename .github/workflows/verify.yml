name: V45 Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run verify

      - name: Start KSA Forge
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for MCP server
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/ide >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Integration tests
        run: npm run test:integration

      - name: Server log on failure
        if: failure()
        run: cat server.log || true
